<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dedale — IT Asset Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#f5f7f8; --surface:#ffffff; --surface2:#fbfcfd;
  --ink:#182029; --muted:#5c6672; --faint:#8b94a0;
  --border:#e4e8ec; --border2:#d3d9df;
  --accent:#1f6f5c; --accent-dim:#e6f1ee; --accent-ink:#134a3d;
  --green:#1f8a5b; --green-bg:#e6f4ec;
  --blue:#2b6cb0; --blue-bg:#e7f0f8;
  --amber:#b7791f; --amber-bg:#fbf1dd;
  --red:#c0392b; --red-bg:#fbe9e7;
  --grey:#6b7480; --grey-bg:#eef1f3;
  --shadow:0 1px 2px rgba(24,32,41,.04),0 4px 16px rgba(24,32,41,.06);
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--canvas);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:'Space Grotesk','Inter',sans-serif}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:14px}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#183b33,#1f6f5c);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.login-card{background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:420px;padding:40px 36px}
.login-card .logo{font-family:'Space Grotesk';font-weight:700;font-size:22px;color:var(--accent);letter-spacing:-.5px}
.login-card .logo span{color:var(--ink)}
.login-card h1{font-size:19px;margin:18px 0 6px;font-weight:600}
.login-card p{color:var(--muted);font-size:13.5px;margin-bottom:24px}
.mode-btn{width:100%;border:1px solid var(--border2);background:var(--surface);border-radius:10px;padding:15px 16px;text-align:left;margin-bottom:11px;transition:border-color .15s,background .15s;display:flex;gap:13px;align-items:flex-start}
.mode-btn:hover{border-color:var(--accent);background:var(--accent-dim)}
.mode-btn .ic{font-size:20px;line-height:1.1}
.mode-btn b{display:block;font-size:14.5px;margin-bottom:2px}
.mode-btn small{color:var(--muted);font-size:12.5px;line-height:1.4}
.login-note{margin-top:18px;font-size:12px;color:var(--faint);text-align:center;line-height:1.5}

/* ---------- Shell ---------- */
#app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--surface);border-right:1px solid var(--border);position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;padding:20px 14px;z-index:50}
.brand{font-family:'Space Grotesk';font-weight:700;font-size:18px;color:var(--accent);letter-spacing:-.5px;padding:6px 10px 20px}
.brand span{color:var(--ink)}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14px;border:none;background:none;width:100%;text-align:left;margin-bottom:2px;transition:background .12s,color .12s}
.nav-item:hover{background:var(--surface2);color:var(--ink)}
.nav-item.active{background:var(--accent-dim);color:var(--accent-ink);font-weight:600}
.nav-item .ic{width:18px;text-align:center;font-size:15px}
.nav-sep{height:1px;background:var(--border);margin:12px 6px}
.side-foot{margin-top:auto;padding:10px}
.user-chip{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;background:var(--surface2);font-size:12.5px}
.user-chip .av{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0}
.user-chip b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.user-chip small{color:var(--faint);font-size:11px}
.signout{margin-top:8px;width:100%;border:1px solid var(--border);background:none;color:var(--muted);border-radius:7px;padding:7px;font-size:12.5px;font-weight:500}
.signout:hover{border-color:var(--red);color:var(--red)}

.main{margin-left:230px;flex:1;min-width:0}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 30px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:40}
.topbar h1{font-size:20px;font-weight:600}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:1px}
.content{padding:26px 30px 60px}

.btn{border:1px solid var(--border2);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 15px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-ink)}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn-ghost{border:none;background:none;color:var(--muted);padding:6px 9px}
.btn-ghost:hover{background:var(--surface2);color:var(--ink)}

/* ---------- Dashboard ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow)}
.stat .lbl{color:var(--muted);font-size:12.5px;font-weight:500;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.stat .val{font-family:'Space Grotesk';font-weight:700;font-size:30px;line-height:1;color:var(--ink)}
.stat .val.sm{font-size:26px}
.stat.accent .val{color:var(--accent)}
.stat.warn{border-color:#eccc8a;background:var(--amber-bg)}
.stat.warn .val{color:var(--amber)}
.stat.warn .lbl{color:var(--amber)}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px}
.panel-h{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-h h3{font-size:15px;font-weight:600}
.panel-b{padding:18px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}

/* bars */
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.bar-row:last-child{margin-bottom:0}
.bar-lbl{width:92px;font-size:13px;color:var(--muted);font-weight:500;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;height:22px;background:var(--surface2);border-radius:5px;overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:5px;background:var(--accent);transition:width .5s cubic-bezier(.2,.7,.3,1)}
.bar-val{width:34px;text-align:right;font-family:'Space Grotesk';font-weight:600;font-size:13px;flex-shrink:0}

/* flagged panel */
.flag-item{display:flex;align-items:flex-start;gap:11px;padding:12px 14px;background:var(--amber-bg);border:1px solid #eccc8a;border-radius:8px;margin-bottom:9px}
.flag-item:last-child{margin-bottom:0}
.flag-item .ic{color:var(--amber);font-size:15px;flex-shrink:0;margin-top:1px}
.flag-item b{font-size:13.5px}
.flag-item p{font-size:12.5px;color:var(--muted);margin-top:2px}
.flag-item[role=button]{cursor:pointer;transition:background .12s,border-color .12s}
.flag-item[role=button]:hover{background:#f8e9c8;border-color:var(--amber)}
.flag-item[role=button]:focus{outline:2px solid var(--amber);outline-offset:1px}
.flag-go{align-self:center;color:var(--amber);font-weight:700;font-size:12.5px;white-space:nowrap;flex-shrink:0}
.filt-note{display:inline-flex;align-items:center;gap:8px;background:var(--amber-bg);border:1px solid #eccc8a;color:var(--amber);font-weight:600;font-size:12.5px;padding:6px 11px;border-radius:8px}
.filt-note button{border:none;background:none;color:var(--amber);font-weight:700;cursor:pointer;text-decoration:underline;padding:0}

/* ---------- Table ---------- */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border2);border-radius:8px;background:var(--surface)}
.search input:focus{outline:none;border-color:var(--accent)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:14px}
.filt{padding:9px 11px;border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:500}
.filt:focus{outline:none;border-color:var(--accent)}

.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:12px 14px;font-weight:600;font-size:12px;color:var(--muted);background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
th:hover{color:var(--ink)}
th .arw{opacity:.4;font-size:10px;margin-left:3px}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface2)}
td.actions{white-space:nowrap;text-align:right}
.tbl-foot{padding:12px 16px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--surface2)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.inuse{background:var(--green-bg);color:var(--green)}
.pill.instock{background:var(--blue-bg);color:var(--blue)}
.pill.repair{background:var(--amber-bg);color:var(--amber)}
.pill.retired{background:var(--grey-bg);color:var(--grey)}
.pill.new{background:var(--green-bg);color:var(--green)}
.pill.good{background:var(--blue-bg);color:var(--blue)}
.pill.fair{background:var(--amber-bg);color:var(--amber)}
.pill.damaged{background:var(--red-bg);color:var(--red)}
.flag-badge{display:inline-flex;align-items:center;gap:4px;color:var(--red);font-size:11px;font-weight:600;background:var(--red-bg);padding:2px 7px;border-radius:5px;margin-left:6px}
.unassigned{color:var(--faint);font-style:italic}
.ic-btn{border:none;background:none;color:var(--muted);padding:5px 7px;border-radius:6px;font-size:14px}
.ic-btn:hover{background:var(--accent-dim);color:var(--accent)}
.ic-btn.del:hover{background:var(--red-bg);color:var(--red)}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(24,32,41,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:560px;max-height:90vh;overflow:auto}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface)}
.modal-h h3{font-size:16px;font-weight:600}
.modal-b{padding:22px}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:8px;background:var(--surface)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.modal-f{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--surface)}
.dd-add{font-size:11.5px;color:var(--accent);font-weight:600;background:none;border:none;padding:2px 0;margin-top:4px}

/* toast */
#toasts{position:fixed;bottom:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;align-items:center;gap:9px;animation:tin .2s}
.toast.ok{background:var(--accent-ink)}
.toast.err{background:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* import */
.drop{border:2px dashed var(--border2);border-radius:12px;padding:34px;text-align:center;background:var(--surface2);transition:border-color .15s}
.drop:hover{border-color:var(--accent)}
.drop .ic{font-size:30px;margin-bottom:10px}
.drop b{display:block;font-size:14px;margin-bottom:3px}
.drop small{color:var(--muted)}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .ic{font-size:34px;opacity:.4;margin-bottom:12px}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}
@media(max-width:720px){.sidebar{display:none}.main{margin-left:0}.content{padding:18px}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="logo">Dedale<span> · Inventory</span></div>
    <h1>IT Asset Inventory</h1>
    <p>Track laptops, peripherals and assignments across Dedale sites.</p>
    <button class="mode-btn" onclick="startDemo()">
      <span class="ic">▶</span>

</div>

    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div><h1 id="pageTitle">Dashboard</h1><div class="sub" id="pageSub">Inventory overview</div></div>
      <div id="topActions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div id="toasts"></div>

let MODE='demo'; // 'demo' | 'sharepoint'
let state={assets:[],employees:[],config:{types:[],brands:[],sites:[],models:{}}};
const LS_KEY='dedale_inv_v1';

const STATUSES=['In Use','In Stock','Under Repair','Retired'];
const CONDITIONS=['New','Good','Fair','Damaged'];

function loadState(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){state=JSON.parse(raw);return;}
  }catch(e){}
  // first run: seed from embedded data
  state=JSON.parse(JSON.stringify(SEED));
  saveState();
}
function saveState(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){}
  if(MODE==='sharepoint') scheduleSpSync();
}
function resetToSeed(){
  if(!confirm('Reset all data back to the originally imported inventory? Any edits you made will be lost.'))return;
  state=JSON.parse(JSON.stringify(SEED));saveState();toast('Inventory reset to imported data','ok');render();
}
function genId(){return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

/* dup serial detection */
function dupSerials(){
  const m={};state.assets.forEach(a=>{if(a.serial){m[a.serial]=(m[a.serial]||0)+1;}});
  return Object.keys(m).filter(s=>m[s]>1);
}
function isFlagged(a){return a.serial && dupSerials().includes(a.serial);}

}

/* ============ DASHBOARD ============ */
function countBy(arr,key){const m={};arr.forEach(x=>{const k=x[key]||'—';m[k]=(m[k]||0)+1;});return m;}
function renderDash(c){
  const A=state.assets,E=state.employees;
  const inUse=A.filter(a=>a.status==='In Use').length;
  const inStock=A.filter(a=>a.status==='In Stock').length;
  const repair=A.filter(a=>a.status==='Under Repair').length;
  const unassigned=A.filter(a=>!a.assignedTo).length;
  const flagged=A.filter(isFlagged).length;
  const byType=countBy(A,'type'),bySite=countBy(A,'site'),byCond=countBy(A,'condition');

  let h=`<div class="stat-grid">
    <div class="stat accent"><div class="lbl">Total assets</div><div class="val">${A.length}</div></div>
    <div class="stat"><div class="lbl">In use</div><div class="val sm">${inUse}</div></div>
    <div class="stat"><div class="lbl">In stock</div><div class="val sm">${inStock}</div></div>
    <div class="stat"><div class="lbl">Unassigned</div><div class="val sm">${unassigned}</div></div>
    <div class="stat"><div class="lbl">People</div><div class="val sm">${E.length}</div></div>
    ${flagged?`<div class="stat warn"><div class="lbl">⚠ Needs review</div><div class="val sm">${flagged}</div></div>`:''}
  </div>`;

  h+=`<div class="two-col">
    <div class="panel"><div class="panel-h"><h3>Assets by type</h3></div><div class="panel-b">${bars(byType,A.length)}</div></div>
    <div class="panel"><div class="panel-h"><h3>Assets by site</h3></div><div class="panel-b">${bars(bySite,A.length)}</div></div>
  </div>`;

  h+=`<div class="two-col">
    <div class="panel"><div class="panel-h"><h3>Condition</h3></div><div class="panel-b">${bars(byCond,A.length)}</div></div>`;

  // flagged detail
  const dups=dupSerials();
  h+=`<div class="panel"><div class="panel-h"><h3>Items needing review</h3></div><div class="panel-b">`;
  if(dups.length){
    dups.forEach(s=>{
      const items=A.filter(a=>a.serial===s);
      h+=`<div class="flag-item" role="button" tabindex="0" onclick="reviewSerial('${esc(s)}')" onkeydown="if(event.key==='Enter')reviewSerial('${esc(s)}')" title="Click to view these assets"><span class="ic">⚠</span><div style="flex:1"><b>Duplicate serial ${esc(s)}</b><p>Used on ${items.length} assets: ${items.map(x=>esc(x.assignedTo||'unassigned')).join(', ')}. Verify against records and correct.</p></div><span class="flag-go">View →</span></div>`;
    });
  } else {
    h+=`<div class="empty" style="padding:24px"><span class="ic">✓</span><b>No issues found</b>Every serial is unique.</div>`;
  }
  h+=`</div></div></div>`;
  c.innerHTML=h;
  requestAnimationFrame(()=>document.querySelectorAll('.bar-fill').forEach(b=>b.style.width=b.dataset.w+'%'));
}
function bars(obj,total){
  const ents=Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  const max=Math.max(...ents.map(e=>e[1]),1);
  return ents.map(([k,v])=>`<div class="bar-row"><div class="bar-lbl" title="${esc(k)}">${esc(k)}</div><div class="bar-track"><div class="bar-fill" data-w="${Math.round(v/max*100)}" style="width:0"></div></div><div class="bar-val">${v}</div></div>`).join('');
}

/* ============ ASSETS ============ */
let aSearch='',aFilt={type:'',status:'',site:''},aSort={k:'type',dir:1},aSerial='';
function reviewSerial(s){aSerial=s;aSearch='';aFilt={type:'',status:'',site:''};nav('assets');}
function clearSerial(){aSerial='';renderAssets(document.getElementById('content'));}
function renderAssets(c){
  const types=['',...state.config.types],statuses=['',...STATUSES],sites=['',...state.config.sites];
  let h='';
  if(aSerial){h+=`<div style="margin-bottom:14px"><span class="filt-note">⚠ Showing flagged assets with serial ${esc(aSerial)} <button onclick="clearSerial()">Clear</button></span></div>`;}
  h+=`<div class="toolbar">
    <div class="search"><span class="ic">⌕</span><input placeholder="Search serial, model, person…" value="${esc(aSearch)}" oninput="aSearch=this.value;drawAssetRows()"></div>
    <select class="filt" onchange="aFilt.type=this.value;drawAssetRows()">${types.map(t=>`<option ${t===aFilt.type?'selected':''}>${t||'All types'}</option>`).join('')}</select>
    <select class="filt" onchange="aFilt.status=this.value;drawAssetRows()">${statuses.map(t=>`<option ${t===aFilt.status?'selected':''}>${t||'All statuses'}</option>`).join('')}</select>
    <select class="filt" onchange="aFilt.site=this.value;drawAssetRows()">${sites.map(t=>`<option ${t===aFilt.site?'selected':''}>${t||'All sites'}</option>`).join('')}</select>
  </div>
  <div class="tbl-wrap"><div class="tbl-scroll"><table>
    <thead><tr>
      ${th('type','Type')}${th('brand','Brand')}${th('model','Model')}${th('serial','Serial')}
      ${th('condition','Condition')}${th('status','Status')}${th('assignedTo','Assigned to')}${th('site','Site')}
      <th style="text-align:right">Actions</th>
    </tr></thead><tbody id="assetBody"></tbody>
  </table></div><div class="tbl-foot" id="assetFoot"></div></div>`;
  c.innerHTML=h;drawAssetRows();
}
function th(k,label){const on=aSort.k===k;return `<th onclick="sortAssets('${k}')">${label}<span class="arw">${on?(aSort.dir>0?'▲':'▼'):'⇅'}</span></th>`;}
function sortAssets(k){if(aSort.k===k)aSort.dir*=-1;else{aSort.k=k;aSort.dir=1;}renderAssets(document.getElementById('content'));}
function filteredAssets(){
  let r=state.assets.slice();
  if(aSerial)r=r.filter(a=>a.serial===aSerial);
  const q=aSearch.trim().toLowerCase();
  if(q)r=r.filter(a=>[a.type,a.brand,a.model,a.serial,a.assignedTo,a.site,a.notes].some(v=>(v||'').toLowerCase().includes(q)));
  if(aFilt.type)r=r.filter(a=>a.type===aFilt.type);
  if(aFilt.status)r=r.filter(a=>a.status===aFilt.status);
  if(aFilt.site)r=r.filter(a=>a.site===aFilt.site);
  r.sort((a,b)=>{const x=(a[aSort.k]||'').toLowerCase(),y=(b[aSort.k]||'').toLowerCase();return x<y?-aSort.dir:x>y?aSort.dir:0;});
  return r;
}
function drawAssetRows(){
  const rows=filteredAssets();const body=document.getElementById('assetBody');if(!body)return;
  if(!rows.length){body.innerHTML=`<tr><td colspan="9"><div class="empty"><span class="ic">▦</span><b>No matching assets</b>Adjust your search or filters.</div></td></tr>`;}
  else body.innerHTML=rows.map(a=>{
    const flag=isFlagged(a)?`<span class="flag-badge">⚠ dup</span>`:'';
    return `<tr>
      <td>${esc(a.type)}</td><td>${esc(a.brand)}</td><td>${esc(a.model)||'<span class="unassigned">—</span>'}</td>
      <td>${esc(a.serial)||'<span class="unassigned">none</span>'}${flag}</td>
      <td>${condPill(a.condition)}</td><td>${statusPill(a.status)}</td>
      <td>${a.assignedTo?esc(a.assignedTo):'<span class="unassigned">Unassigned</span>'}</td>
      <td>${esc(a.site)}</td>
      <td class="actions"><button class="ic-btn" title="Edit" onclick="openAsset('${a.id}')">✎</button><button class="ic-btn del" title="Delete" onclick="delAsset('${a.id}')">🗑</button></td>
    </tr>`;}).join('');
  document.getElementById('assetFoot').innerHTML=`<span>${rows.length} of ${state.assets.length} assets</span>`;
}
function statusPill(s){const m={'In Use':'inuse','In Stock':'instock','Under Repair':'repair','Retired':'retired'};return `<span class="pill ${m[s]||'retired'}">${esc(s)||'—'}</span>`;}
function condPill(c){const m={'New':'new','Good':'good','Fair':'fair','Damaged':'damaged'};return `<span class="pill ${m[c]||'good'}">${esc(c)||'—'}</span>`;}

/* ============ EMPLOYEES ============ */
let eSearch='',eSort={k:'name',dir:1};
function renderEmps(c){
  let h=`<div class="toolbar"><div class="search"><span class="ic">⌕</span><input placeholder="Search name, role, email…" value="${esc(eSearch)}" oninput="eSearch=this.value;drawEmpRows()"></div></div>
  <div class="tbl-wrap"><div class="tbl-scroll"><table>
    <thead><tr>${the('employeeId','ID')}${the('name','Name')}${the('role','Role')}${the('email','Email')}${the('site','Site')}<th>Assigned assets</th><th style="text-align:right">Actions</th></tr></thead>
    <tbody id="empBody"></tbody></table></div><div class="tbl-foot" id="empFoot"></div></div>`;
  c.innerHTML=h;drawEmpRows();
}
function the(k,l){const on=eSort.k===k;return `<th onclick="sortEmp('${k}')">${l}<span class="arw">${on?(eSort.dir>0?'▲':'▼'):'⇅'}</span></th>`;}
function sortEmp(k){if(eSort.k===k)eSort.dir*=-1;else{eSort.k=k;eSort.dir=1;}renderEmps(document.getElementById('content'));}
function drawEmpRows(){
  let r=state.employees.slice();const q=eSearch.trim().toLowerCase();
  if(q)r=r.filter(e=>[e.name,e.role,e.email,e.employeeId].some(v=>(v||'').toLowerCase().includes(q)));
  r.sort((a,b)=>{const x=(a[eSort.k]||'').toLowerCase(),y=(b[eSort.k]||'').toLowerCase();return x<y?-eSort.dir:x>y?eSort.dir:0;});
  const body=document.getElementById('empBody');if(!body)return;
  if(!r.length){body.innerHTML=`<tr><td colspan="7"><div class="empty"><span class="ic">◉</span><b>No matching people</b></div></td></tr>`;}
  else body.innerHTML=r.map(e=>{
    const assets=state.assets.filter(a=>a.assignedTo===e.name);
    return `<tr>
      <td style="font-variant-numeric:tabular-nums;color:var(--muted)">${esc(e.employeeId)||'—'}</td>
      <td><b>${esc(e.name)}</b></td><td>${esc(e.role)}</td><td style="color:var(--muted)">${esc(e.email)}</td><td>${esc(e.site)}</td>
      <td>${assets.length?assets.map(a=>esc(a.type)+' '+esc(a.model||a.brand)).join(', '):'<span class="unassigned">none</span>'}</td>
      <td class="actions"><button class="ic-btn" onclick="openEmp('${e.employeeId||''}','${esc(e.name).replace(/'/g,"\\'")}')">✎</button><button class="ic-btn del" onclick="delEmp('${esc(e.name).replace(/'/g,"\\'")}')">🗑</button></td>
    </tr>`;}).join('');
  document.getElementById('empFoot').innerHTML=`<span>${r.length} of ${state.employees.length} people</span>`;
}

/* ============ MODALS: ASSET ============ */
function openAsset(id){
  const a=id?state.assets.find(x=>x.id===id):{id:'',type:'',brand:'',model:'',serial:'',condition:'New',status:'In Stock',assignedTo:'',site:state.config.sites[0]||'',warrantyExpiry:'',supplier:'',notes:''};
  const dd=(arr,val,onch)=>arr.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('');
  const empOpts=['',...state.employees.map(e=>e.name)];
  const m=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-h"><h3>${id?'Edit asset':'Add asset'}</h3><button class="btn-ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <div class="row2">
        <div class="field"><label>Type</label><select id="f_type">${dd(state.config.types,a.type)}</select><button class="dd-add" onclick="addOpt('types','f_type')">+ Add type</button></div>
        <div class="field"><label>Brand</label><select id="f_brand" onchange="syncModels()">${dd(state.config.brands,a.brand)}</select><button class="dd-add" onclick="addOpt('brands','f_brand')">+ Add brand</button></div>
      </div>
      <div class="row2">
        <div class="field"><label>Model</label><select id="f_model">${dd(state.config.models[a.brand]||[],a.model)}</select><button class="dd-add" onclick="addModel()">+ Add model</button></div>
        <div class="field"><label>Serial (asset tag)</label><input id="f_serial" value="${esc(a.serial)}" placeholder="e.g. PF5E9CDC"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Condition</label><select id="f_condition">${dd(CONDITIONS,a.condition)}</select></div>
        <div class="field"><label>Status</label><select id="f_status">${dd(STATUSES,a.status)}</select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Assigned to</label><select id="f_assignedTo">${empOpts.map(o=>`<option ${o===a.assignedTo?'selected':''}>${esc(o)||'— Unassigned —'}</option>`).join('')}</select></div>
        <div class="field"><label>Site</label><select id="f_site">${dd(state.config.sites,a.site)}</select><button class="dd-add" onclick="addOpt('sites','f_site')">+ Add site</button></div>
      </div>
      <div class="row2">
        <div class="field"><label>Warranty expiry <span style="font-weight:400;color:var(--faint)">(optional)</span></label><input id="f_warrantyExpiry" type="date" value="${esc(a.warrantyExpiry)}"></div>
        <div class="field"><label>Supplier <span style="font-weight:400;color:var(--faint)">(optional)</span></label><input id="f_supplier" value="${esc(a.supplier)}"></div>
      </div>
      <div class="field"><label>Notes</label><textarea id="f_notes">${esc(a.notes)}</textarea></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAsset('${a.id}')">${id?'Save changes':'Add asset'}</button></div>
  </div></div>`;
  mount(m);
}
function syncModels(){const b=document.getElementById('f_brand').value;const sel=document.getElementById('f_model');sel.innerHTML=(state.config.models[b]||[]).map(o=>`<option>${esc(o)}</option>`).join('');}
function addModel(){const b=document.getElementById('f_brand').value;const v=prompt('New model for '+b+':');if(!v)return;state.config.models[b]=state.config.models[b]||[];if(!state.config.models[b].includes(v))state.config.models[b].push(v);saveState();syncModels();document.getElementById('f_model').value=v;}
function addOpt(key,fid){const v=prompt('Add new '+key.slice(0,-1)+':');if(!v)return;if(!state.config[key].includes(v)){state.config[key].push(v);state.config[key].sort();saveState();}const sel=document.getElementById(fid);sel.innerHTML=state.config[key].map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('');}
function saveAsset(id){
  const g=k=>{const el=document.getElementById('f_'+k);let v=el?el.value:'';if(v==='— Unassigned —')v='';return v;};
  const rec={type:g('type'),brand:g('brand'),model:g('model'),serial:g('serial').trim(),condition:g('condition'),status:g('status'),assignedTo:g('assignedTo'),site:g('site'),warrantyExpiry:g('warrantyExpiry'),supplier:g('supplier'),notes:g('notes')};
  if(id){Object.assign(state.assets.find(x=>x.id===id),rec);toast('Asset updated','ok');}
  else{rec.id=genId();state.assets.push(rec);toast('Asset added','ok');}
  saveState();closeModal();render();
}
function delAsset(id){const a=state.assets.find(x=>x.id===id);if(!confirm('Delete this '+(a.type||'asset')+(a.serial?' ('+a.serial+')':'')+'?'))return;state.assets=state.assets.filter(x=>x.id!==id);saveState();toast('Asset deleted','ok');render();}

/* ============ MODALS: EMPLOYEE ============ */
function openEmp(eid,name){
  const e=name?state.employees.find(x=>x.name===name):{employeeId:'',name:'',role:'',email:'',site:state.config.sites[0]||'',department:'',startDate:'',status:'Active'};
  const dd=(arr,val)=>arr.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('');
  const m=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">
    <div class="modal-h"><h3>${name?'Edit person':'Add person'}</h3><button class="btn-ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-b">
      <div class="row2"><div class="field"><label>Employee ID</label><input id="e_employeeId" value="${esc(e.employeeId)}" placeholder="C2023-0001"></div>
      <div class="field"><label>Full name</label><input id="e_name" value="${esc(e.name)}"></div></div>
      <div class="field"><label>Role</label><input id="e_role" value="${esc(e.role)}"></div>
      <div class="field"><label>Email</label><input id="e_email" value="${esc(e.email)}"></div>
      <div class="row2"><div class="field"><label>Site</label><select id="e_site">${dd(state.config.sites,e.site)}</select></div>
      <div class="field"><label>Status</label><select id="e_status">${dd(['Active','Offboarded'],e.status)}</select></div></div>
      <div class="row2"><div class="field"><label>Department <span style="font-weight:400;color:var(--faint)">(optional)</span></label><input id="e_department" value="${esc(e.department||'')}"></div>
      <div class="field"><label>Start date <span style="font-weight:400;color:var(--faint)">(optional)</span></label><input id="e_startDate" type="date" value="${esc(e.startDate||'')}"></div></div>
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEmp('${name?esc(name).replace(/'/g,"\\'"):''}')">${name?'Save changes':'Add person'}</button></div>
  </div></div>`;
  mount(m);
}
function saveEmp(origName){
  const g=k=>{const el=document.getElementById('e_'+k);return el?el.value:'';};
  const rec={employeeId:g('employeeId'),name:g('name').trim(),role:g('role'),email:g('email'),site:g('site'),department:g('department'),startDate:g('startDate'),status:g('status')};
  if(!rec.name){toast('Name is required','err');return;}
  if(origName){const old=state.employees.find(x=>x.name===origName);Object.assign(old,rec);if(origName!==rec.name){state.assets.forEach(a=>{if(a.assignedTo===origName)a.assignedTo=rec.name;});}toast('Person updated','ok');}
  else{state.employees.push(rec);toast('Person added','ok');}
  saveState();closeModal();render();
}
function delEmp(name){const e=state.employees.find(x=>x.name===name);const cnt=state.assets.filter(a=>a.assignedTo===name).length;if(!confirm('Delete '+name+'?'+(cnt?'\n\n'+cnt+' assigned asset(s) will become Unassigned.':'')))return;state.assets.forEach(a=>{if(a.assignedTo===name)a.assignedTo='';});state.employees=state.employees.filter(x=>x.name!==name);saveState();toast('Person deleted','ok');render();}

/* ============ IMPORT / EXPORT ============ */
function renderImport(c){
  c.innerHTML=`
  <div class="two-col">
    <div class="panel"><div class="panel-h"><h3>Import assets (CSV)</h3></div><div class="panel-b">
      <label class="drop" style="display:block;cursor:pointer">
        <span class="ic">↥</span><b>Choose assets CSV</b><small>Columns: Type, Brand, Model, Serial, Condition, Status, Assigned To, Site</small>
        <input type="file" accept=".csv" class="hidden" onchange="importCsv(this,'assets')">
      </label>
    </div></div>
    <div class="panel"><div class="panel-h"><h3>Import people (CSV)</h3></div><div class="panel-b">
      <label class="drop" style="display:block;cursor:pointer">
        <span class="ic">↥</span><b>Choose people CSV</b><small>Columns: Employee ID, Full Name, Role, Email, Site</small>
        <input type="file" accept=".csv" class="hidden" onchange="importCsv(this,'employees')">
      </label>
    </div></div>
  </div>
  <div class="panel"><div class="panel-h"><h3>Export</h3></div><div class="panel-b" style="display:flex;gap:11px;flex-wrap:wrap">
    <button class="btn" onclick="exportCsv('assets')">↧ Export assets CSV</button>
    <button class="btn" onclick="exportCsv('employees')">↧ Export people CSV</button>
    <button class="btn" onclick="window.print()">🖨 Print / Save PDF</button>
    <button class="btn" style="margin-left:auto" onclick="resetToSeed()">↺ Reset to imported data</button>
  </div></div>`;
}
function parseCsv(txt){
  const rows=[];let i=0,f='',row=[],q=false;
  while(i<txt.length){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;if(f!==''||row.length){row.push(f);rows.push(row);row=[];f='';}}else f+=c;}
    i++;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function importCsv(input,kind){
  const file=input.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const rows=parseCsv(rd.result).filter(r=>r.some(c=>c.trim()!==''));
      const hd=rows.shift().map(h=>h.trim().toLowerCase());
      const col=n=>hd.findIndex(h=>h.includes(n));
      let added=0;
      if(kind==='assets'){
        const ci={type:col('type'),brand:col('brand'),model:col('model'),serial:col('serial'),condition:col('condition'),status:col('status'),assigned:col('assigned'),site:col('site')};
        rows.forEach(r=>{const get=i=>i>=0?(r[i]||'').trim():'';
          const rec={id:genId(),type:get(ci.type),brand:get(ci.brand),model:get(ci.model),serial:get(ci.serial),condition:get(ci.condition)||'New',status:get(ci.status)||'In Stock',assignedTo:get(ci.assigned),site:get(ci.site),warrantyExpiry:'',supplier:'',notes:''};
          if(rec.type||rec.serial){state.assets.push(rec);added++;refreshConfig(rec);}});
      }else{
        const ci={id:col('id'),name:col('name'),role:col('role'),email:col('email'),site:col('site')};
        rows.forEach(r=>{const get=i=>i>=0?(r[i]||'').trim():'';
          const rec={employeeId:get(ci.id),name:get(ci.name),role:get(ci.role),email:get(ci.email),site:get(ci.site),department:'',startDate:'',status:'Active'};
          if(rec.name){state.employees.push(rec);added++;}});
      }
      saveState();toast('Imported '+added+' '+kind,'ok');nav(kind);
    }catch(e){toast('Import failed: '+e.message,'err');}
  };
  rd.readAsText(file);
}
function refreshConfig(a){if(a.type&&!state.config.types.includes(a.type))state.config.types.push(a.type);if(a.brand&&!state.config.brands.includes(a.brand))state.config.brands.push(a.brand);if(a.site&&!state.config.sites.includes(a.site))state.config.sites.push(a.site);if(a.brand&&a.model){state.config.models[a.brand]=state.config.models[a.brand]||[];if(!state.config.models[a.brand].includes(a.model))state.config.models[a.brand].push(a.model);}}
function exportCsv(kind){
  let head,rows;
  if(kind==='assets'){head=['Type','Brand','Model','Serial','Condition','Status','Assigned To','Site','Warranty Expiry','Supplier','Notes'];
    rows=state.assets.map(a=>[a.type,a.brand,a.model,a.serial,a.condition,a.status,a.assignedTo,a.site,a.warrantyExpiry,a.supplier,a.notes]);}
  else{head=['Employee ID','Full Name','Role','Email','Site','Department','Start Date','Status'];
    rows=state.employees.map(e=>[e.employeeId,e.name,e.role,e.email,e.site,e.department,e.startDate,e.status]);}
  const csv=[head,...rows].map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='dedale-'+kind+'-'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(url);
  toast('Exported '+kind,'ok');
}

/* ============ UTIL ============ */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function mount(html){document.getElementById('modalMount').innerHTML=html;}
function closeModal(){document.getElementById('modalMount').innerHTML='';}
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.innerHTML=(kind==='ok'?'✓ ':kind==='err'?'⚠ ':'')+esc(msg);document.getElementById('toasts').appendChild(t);setTimeout(()=>t.remove(),2600);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
</script>
